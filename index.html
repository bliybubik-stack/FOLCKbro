<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Studio · Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="style.css" rel="stylesheet" />
</head>
<body>
    <!-- Main App -->
    <div id="app" class="flex h-screen w-screen overflow-hidden bg-[#0d0d0f] text-gray-200">

        <!-- ===== LEFT SIDEBAR ===== -->
        <aside class="w-[64px] min-w-[64px] h-full bg-[#141416] border-r border-[#2a2a2e] flex flex-col items-center py-3 gap-1 z-20">
            <!-- Logo -->
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center mb-2 shadow-lg shadow-blue-500/20">
                <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>

            <!-- Tool buttons -->
            <button data-tool="brush" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Brush">
                <i data-lucide="brush" class="w-5 h-5"></i>
            </button>
            <button data-tool="pencil" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Pencil">
                <i data-lucide="pencil" class="w-5 h-5"></i>
            </button>
            <button data-tool="marker" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Marker">
                <i data-lucide="highlighter" class="w-5 h-5"></i>
            </button>
            <button data-tool="airbrush" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Airbrush">
                <i data-lucide="spray-can" class="w-5 h-5"></i>
            </button>
            <button data-tool="calligraphy" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Calligraphy">
                <i data-lucide="feather" class="w-5 h-5"></i>
            </button>
            <button data-tool="charcoal" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Charcoal">
                <i data-lucide="flame" class="w-5 h-5"></i>
            </button>
            <button data-tool="watercolor" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Watercolor">
                <i data-lucide="droplets" class="w-5 h-5"></i>
            </button>

            <div class="w-8 h-px bg-[#2a2a2e] my-1"></div>

            <button data-tool="eraser" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Eraser">
                <i data-lucide="eraser" class="w-5 h-5"></i>
            </button>
            <button data-tool="fill" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Fill">
                <i data-lucide="paint-bucket" class="w-5 h-5"></i>
            </button>
            <button data-tool="text" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Text">
                <i data-lucide="type" class="w-5 h-5"></i>
            </button>
            <button data-tool="select" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#2a2a2e] transition-all duration-200 active:scale-95" title="Select">
                <i data-lucide="square" class="w-5 h-5"></i>
            </button>

            <div class="flex-1"></div>

            <!-- Color preview -->
            <div id="miniColorPreview" class="w-8 h-8 rounded-xl border-2 border-[#2a2a2e] cursor-pointer hover:border-[#4a4a4e] transition-all" style="background: #ff3366;"></div>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="flex-1 flex flex-col bg-[#121214]">
            <!-- Top Bar -->
            <header class="h-12 bg-[#1a1a1e] border-b border-[#2a2a2e] flex items-center px-4 justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-medium text-gray-400">Canvas Studio</span>
                    <span class="text-xs text-gray-600">·</span>
                    <span class="text-xs text-gray-500" id="canvasInfo">1200 × 800</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="undoBtn" class="px-3 py-1 text-xs bg-[#2a2a2e] rounded-lg hover:bg-[#3a3a3e] transition-all flex items-center gap-1.5">
                        <i data-lucide="undo-2" class="w-3.5 h-3.5"></i> Undo
                    </button>
                    <button id="redoBtn" class="px-3 py-1 text-xs bg-[#2a2a2e] rounded-lg hover:bg-[#3a3a3e] transition-all flex items-center gap-1.5">
                        <i data-lucide="redo-2" class="w-3.5 h-3.5"></i> Redo
                    </button>
                    <button id="clearBtn" class="px-3 py-1 text-xs bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition-all flex items-center gap-1.5">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear
                    </button>
                </div>
            </header>

            <!-- Canvas Area -->
            <div class="flex-1 relative bg-[#1a1a1e] flex items-center justify-center p-6">
                <div class="bg-white rounded-xl shadow-2xl overflow-hidden" style="width: 95%; height: 92%;">
                    <canvas id="drawCanvas" class="w-full h-full block"></canvas>
                </div>
            </div>
        </div>

        <!-- ===== RIGHT SIDEBAR ===== -->
        <aside class="w-[320px] min-w-[320px] h-full bg-[#141416] border-l border-[#2a2a2e] flex flex-col overflow-hidden">
            <!-- Tabs -->
            <div class="flex border-b border-[#2a2a2e]">
                <button class="tab-btn flex-1 py-2.5 text-xs font-medium text-gray-400 hover:text-white transition-all border-b-2 border-transparent hover:border-[#4a4a4e]" data-tab="brushes">Brushes</button>
                <button class="tab-btn flex-1 py-2.5 text-xs font-medium text-gray-400 hover:text-white transition-all border-b-2 border-transparent hover:border-[#4a4a4e]" data-tab="settings">Settings</button>
                <button class="tab-btn flex-1 py-2.5 text-xs font-medium text-gray-400 hover:text-white transition-all border-b-2 border-transparent hover:border-[#4a4a4e]" data-tab="layers">Layers</button>
            </div>

            <!-- Tab Content -->
            <div class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- BRUSHES TAB -->
                <div id="tab-brushes" class="tab-content">
                    <div class="text-xs font-medium text-gray-500 mb-2">Brush Library</div>
                    <div class="grid grid-cols-3 gap-1.5" id="brushGrid">
                        <!-- Brush items will be generated by JS -->
                    </div>
                </div>

                <!-- SETTINGS TAB -->
                <div id="tab-settings" class="tab-content hidden">
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Size</label>
                            <input type="range" id="sizeSlider" min="1" max="80" value="8" class="w-full h-1.5 bg-[#2a2a2e] rounded appearance-none">
                            <div class="flex justify-between text-[10px] text-gray-500">
                                <span>1</span>
                                <span id="sizeDisplay">8px</span>
                                <span>80</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Opacity</label>
                            <input type="range" id="opacitySlider" min="5" max="100" value="100" class="w-full h-1.5 bg-[#2a2a2e] rounded appearance-none">
                            <div class="flex justify-between text-[10px] text-gray-500">
                                <span>5%</span>
                                <span id="opacityDisplay">100%</span>
                                <span>100%</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Flow</label>
                            <input type="range" id="flowSlider" min="1" max="100" value="100" class="w-full h-1.5 bg-[#2a2a2e] rounded appearance-none">
                            <div class="flex justify-between text-[10px] text-gray-500">
                                <span>1%</span>
                                <span id="flowDisplay">100%</span>
                                <span>100%</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Hardness</label>
                            <input type="range" id="hardnessSlider" min="0" max="100" value="100" class="w-full h-1.5 bg-[#2a2a2e] rounded appearance-none">
                            <div class="flex justify-between text-[10px] text-gray-500">
                                <span>Soft</span>
                                <span id="hardnessDisplay">100%</span>
                                <span>Hard</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Spacing</label>
                            <input type="range" id="spacingSlider" min="0" max="50" value="0" class="w-full h-1.5 bg-[#2a2a2e] rounded appearance-none">
                            <div class="flex justify-between text-[10px] text-gray-500">
                                <span>0%</span>
                                <span id="spacingDisplay">0%</span>
                                <span>50%</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 pt-1">
                            <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                                <input type="checkbox" id="pressureToggle" class="w-3.5 h-3.5 accent-blue-500">
                                Pressure Sensitivity
                            </label>
                            <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                                <input type="checkbox" id="smoothingToggle" class="w-3.5 h-3.5 accent-blue-500">
                                Smoothing
                            </label>
                        </div>
                    </div>
                </div>

                <!-- LAYERS TAB -->
                <div id="tab-layers" class="tab-content hidden">
                    <div class="flex items-center gap-2 mb-3">
                        <button id="addLayerBtn" class="px-3 py-1 text-xs bg-blue-500/20 text-blue-400 rounded-lg hover:bg-blue-500/30 transition-all flex items-center gap-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
                        </button>
                        <button id="removeLayerBtn" class="px-3 py-1 text-xs bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition-all flex items-center gap-1">
                            <i data-lucide="minus" class="w-3.5 h-3.5"></i> Remove
                        </button>
                        <button id="mergeLayerBtn" class="px-3 py-1 text-xs bg-purple-500/20 text-purple-400 rounded-lg hover:bg-purple-500/30 transition-all flex items-center gap-1">
                            <i data-lucide="layers" class="w-3.5 h-3.5"></i> Merge
                        </button>
                    </div>
                    <div id="layerList" class="space-y-1.5"></div>
                </div>
            </div>

            <!-- Color Section -->
            <div class="border-t border-[#2a2a2e] p-3">
                <div class="flex items-center gap-3">
                    <div id="colorPreview" class="w-10 h-10 rounded-xl border-2 border-[#2a2a2e] flex-shrink-0" style="background: #ff3366;"></div>
                    <div class="flex-1">
                        <input id="hexInput" class="w-full bg-[#1a1a1e] border border-[#2a2a2e] rounded-lg px-2 py-1 text-xs font-mono text-gray-200 focus:border-blue-500 focus:outline-none" value="FF3366" maxlength="6">
                    </div>
                    <button id="randomColorBtn" class="px-2.5 py-1.5 text-xs bg-[#2a2a2e] rounded-lg hover:bg-[#3a3a3e] transition-all">
                        <i data-lucide="shuffle" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="flex items-center gap-1 mt-2 flex-wrap" id="colorHistory"></div>
            </div>
        </aside>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#1a1a1e] border border-[#2a2a2e] rounded-xl px-5 py-2.5 text-sm text-gray-200 shadow-2xl opacity-0 transition-all duration-300 pointer-events-none backdrop-blur-xl">
        Toast message
    </div>

    <script src="app.js"></script>
</body>
</html>
