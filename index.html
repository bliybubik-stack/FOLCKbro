<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlockMod - Drawing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- ЛЕВАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ -->
        <div class="toolbar-left">
            <div class="toolbar-top">
                <button class="tool-btn" id="menu-btn"><i class="fas fa-chevron-down"></i></button>
                <button class="tool-btn" id="pan-tool"><i class="fas fa-hand-paper"></i></button>
                <button class="tool-btn" id="rotate-tool"><i class="fas fa-sync-alt"></i></button>
                <button class="tool-btn" id="eyedropper-tool"><i class="fas fa-eye-dropper"></i></button>
                <button class="tool-btn" id="select-tool"><i class="fas fa-mouse-pointer"></i></button>
                <button class="tool-btn active" id="pen-tool"><i class="fas fa-paint-brush"></i></button>
                <button class="tool-btn" id="bucket-tool"><i class="fas fa-fill-drip"></i></button>
                <button class="tool-btn" id="text-tool"><i class="fas fa-font"></i></button>
                <button class="tool-btn" id="stamp-tool"><i class="fas fa-arrows-alt-v"></i></button>
                <button class="tool-btn" id="rect-tool"><i class="fas fa-square"></i></button>
                <button class="tool-btn" id="circle-tool"><i class="fas fa-circle"></i></button>
                <button class="tool-btn" id="lasso-tool"><i class="fas fa-vector-square"></i></button>
                <button class="tool-btn" id="effect-tool"><i class="fas fa-star"></i></button>
            </div>
            <div class="toolbar-bottom">
                <button class="tool-btn" id="pencil-tool"><i class="fas fa-pencil-alt"></i></button>
            </div>
        </div>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <div class="main-area">
            <!-- ХОЛСТ -->
            <div class="canvas-wrapper">
                <div class="canvas-container">
                    <canvas id="drawingCanvas"></canvas>
                </div>
            </div>

            <!-- ПРАВАЯ ПАНЕЛЬ -->
            <div class="right-panel">
                <!-- Заголовок с пользователями -->
                <div class="panel-header">
                    <span class="panel-title"><i class="fas fa-users"></i> СПИСОК ПОЛЬЗОВАТЕЛЕЙ</span>
                    <div class="user-list-header">
                        <span class="user-you">Вы</span>
                        <span class="user-anon">Anonymous</span>
                    </div>
                </div>

                <!-- НАСТРОЙКИ ИНСТРУМЕНТА -->
                <div class="panel-section">
                    <span class="section-title"><i class="fas fa-sliders-h"></i> НАСТРОЙКИ ИНСТРУМЕНТА</span>
                    <div class="settings-grid">
                        <div class="setting-row">
                            <label>Размер</label>
                            <input type="text" id="size-setting" value="8">
                        </div>
                        <div class="setting-row">
                            <label>Непрозрачность</label>
                            <input type="text" id="opacity-setting" value="100">
                        </div>
                        <div class="setting-row">
                            <label>Размытие</label>
                            <input type="text" id="blur-setting" value="0">
                        </div>
                        <div class="setting-row">
                            <label>Сглаживание</label>
                            <input type="text" id="smoothing-setting" value="0">
                        </div>
                        <div class="setting-row">
                            <label>Промежуток</label>
                            <input type="text" id="gap-setting" value="0">
                        </div>
                        <div class="setting-row">
                            <label>Давление</label>
                            <input type="text" id="pressure-setting" value="100">
                        </div>
                        <div class="setting-row">
                            <label>Шрифт</label>
                            <select id="font-setting">
                                <option>Rubik</option>
                                <option>Arial</option>
                                <option>Times New Roman</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <label>Правый клик</label>
                            <select id="rightclick-setting">
                                <option>Следующий шрифт</option>
                                <option>Отменить штрих</option>
                                <option>Курсор</option>
                                <option>Круг</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- ПРЕСЕТЫ -->
                <div class="panel-section">
                    <span class="section-title"><i class="fas fa-cloud"></i> ПРЕДУСТАНОВКИ</span>
                    <div class="presets-grid" id="presets-grid"></div>
                    <div class="presets-hint">Удерживайте для установки. Нажмите, чтобы загрузить.</div>
                </div>

                <!-- ЦВЕТОВОЕ КОЛЕСО -->
                <div class="panel-section">
                    <span class="section-title"><i class="fas fa-palette"></i> ЦВЕТОВОЕ КОЛЕСО</span>
                    <div class="color-section">
                        <div class="color-wheel-container">
                            <div class="color-wheel" id="colorWheel">
                                <div class="wheel-inner-square"></div>
                            </div>
                        </div>
                        <div class="color-swatches">
                            <div class="color-swatch primary" id="primary-color" style="background: #000000;"></div>
                            <div class="color-swatch secondary" id="secondary-color" style="background: #ffffff;"></div>
                            <i class="fas fa-exchange-alt swap-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- СЛОИ -->
                <div class="panel-section">
                    <span class="section-title"><i class="fas fa-layer-group"></i> СЛОЙ</span>
                    <div class="layers-controls">
                        <button><i class="fas fa-arrow-down"></i></button>
                        <button><i class="fas fa-folder-plus"></i></button>
                        <button><i class="fas fa-arrows-alt-h"></i></button>
                        <button><i class="fas fa-arrows-alt-v"></i></button>
                        <button><i class="fas fa-save"></i></button>
                    </div>
                    <div class="layers-list" id="layers-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="tools.js"></script>
    <script src="ui.js"></script>
    <script src="layers.js"></script>
</body>
</html>
