<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlockMod · Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet" />
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div class="flex h-screen w-screen overflow-hidden bg-[#1c1c1e] text-gray-200">
        <!-- LEFT: Canvas area (white) -->
        <main class="flex-1 h-full bg-white flex items-center justify-center relative">
            <canvas id="drawCanvas" class="w-full h-full block"></canvas>
            <!-- subtle overlay info -->
            <div class="absolute bottom-3 left-4 text-xs text-gray-400 bg-black/20 px-3 py-1 rounded-full backdrop-blur-sm pointer-events-none select-none">
                FlockMod · fallback
            </div>
        </main>

        <!-- RIGHT: Professional Sidebar (like ibisPaint style) -->
        <aside class="w-[72px] min-w-[72px] h-full bg-[#1c1c1e] border-l border-[#2c2c2e] flex flex-col items-center py-3 gap-2 overflow-y-auto">
            
            <!-- Top: Color Picker (swatches) -->
            <div class="flex flex-col items-center gap-1.5 px-1 py-2 w-full border-b border-[#2c2c2e]">
                <div id="colorPreview" class="w-9 h-9 rounded-full border-2 border-white/20 shadow-lg transition-all cursor-pointer" style="background: #000000;"></div>
                <div class="flex gap-1">
                    <div class="w-4 h-4 rounded-full border border-white/10 cursor-pointer hover:scale-110 transition" style="background: #000000;" onclick="setColor('#000000')"></div>
                    <div class="w-4 h-4 rounded-full border border-white/10 cursor-pointer hover:scale-110 transition" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
                </div>
            </div>

            <!-- Brush size slider -->
            <div class="flex flex-col items-center gap-1 px-2 py-2 w-full border-b border-[#2c2c2e]">
                <i class="fa-solid fa-pen text-gray-400 text-sm"></i>
                <input type="range" id="sizeSlider" min="1" max="50" value="8" class="w-10 h-32 bg-gray-700 rounded-full appearance-none slider-vertical" />
                <span id="sizeDisplay" class="text-[10px] text-gray-400 font-mono">8</span>
            </div>

            <!-- Opacity -->
            <div class="flex flex-col items-center gap-1 px-2 py-2 w-full border-b border-[#2c2c2e]">
                <i class="fa-regular fa-circle-dot text-gray-400 text-sm"></i>
                <input type="range" id="opacitySlider" min="5" max="100" value="100" class="w-10 h-32 bg-gray-700 rounded-full appearance-none slider-vertical" />
                <span id="opacityDisplay" class="text-[10px] text-gray-400 font-mono">100</span>
            </div>

            <!-- Tools (icons) -->
            <div class="flex flex-col items-center gap-2 px-1 py-2 w-full border-b border-[#2c2c2e]">
                <button class="tool-btn active" data-tool="brush" title="Brush"><i class="fa-solid fa-paintbrush text-lg"></i></button>
                <button class="tool-btn" data-tool="eraser" title="Eraser"><i class="fa-solid fa-eraser text-lg"></i></button>
                <button class="tool-btn" data-tool="bucket" title="Fill"><i class="fa-solid fa-fill-drip text-lg"></i></button>
                <button class="tool-btn" data-tool="picker" title="Eyedropper"><i class="fa-solid fa-eye-dropper text-lg"></i></button>
            </div>

            <!-- Layer controls (simplified) -->
            <div class="flex flex-col items-center gap-1 px-1 py-2 w-full border-b border-[#2c2c2e]">
                <button id="addLayerBtn" class="text-gray-400 hover:text-white transition" title="Add Layer"><i class="fa-solid fa-plus text-lg"></i></button>
                <span class="text-[8px] text-gray-500 font-mono" id="layerCount">1</span>
            </div>

            <!-- Undo / Redo -->
            <div class="flex flex-col items-center gap-2 px-1 py-2 w-full">
                <button id="undoBtn" class="text-gray-400 hover:text-white transition" title="Undo"><i class="fa-solid fa-rotate-left text-lg"></i></button>
                <button id="redoBtn" class="text-gray-400 hover:text-white transition" title="Redo"><i class="fa-solid fa-rotate-right text-lg"></i></button>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
