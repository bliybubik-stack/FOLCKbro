<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>draw · right toolbar</title>
    <!-- styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- main canvas area -->
        <main class="canvas-wrapper">
            <canvas id="drawCanvas" width="800" height="600"></canvas>
        </main>

        <!-- right toolbar -->
        <aside class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" data-tool="pen" title="Pen">✏️</button>
                <button class="tool-btn" data-tool="eraser" title="Eraser">🧹</button>
                <button class="tool-btn" data-tool="text" title="Text">🔤</button>
            </div>

            <div class="separator"></div>

            <!-- 7 brush settings: size, opacity, color, smooth, hardness, spacing, flow -->
            <div class="setting-group">
                <label>Size</label>
                <input type="range" id="brushSize" min="1" max="40" value="8">
                <span id="sizeValue">8</span>
            </div>

            <div class="setting-group">
                <label>Opacity</label>
                <input type="range" id="brushOpacity" min="5" max="100" value="100">
                <span id="opacityValue">100%</span>
            </div>

            <div class="setting-group">
                <label>Color</label>
                <input type="color" id="brushColor" value="#1a1a2e">
            </div>

            <div class="setting-group">
                <label>Smooth</label>
                <input type="range" id="smoothness" min="0" max="10" value="4">
                <span id="smoothValue">4</span>
            </div>

            <div class="setting-group">
                <label>Hardness</label>
                <input type="range" id="hardness" min="0" max="100" value="80">
                <span id="hardnessValue">80%</span>
            </div>

            <div class="setting-group">
                <label>Spacing</label>
                <input type="range" id="spacing" min="1" max="20" value="4">
                <span id="spacingValue">4</span>
            </div>

            <div class="setting-group">
                <label>Flow</label>
                <input type="range" id="flow" min="1" max="100" value="90">
                <span id="flowValue">90%</span>
            </div>

            <div class="separator"></div>

            <button id="clearCanvas" class="action-btn">🗑️ Clear</button>
        </aside>
    </div>

    <!-- main script -->
    <script src="app.js"></script>
</body>
</html>
