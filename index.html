<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <!-- Подключение CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключение иконок (Font Awesome) для тулбара -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Главный контейнер приложения -->
    <div class="app-container">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ -->
        <div class="toolbar">
            <div class="toolbar-top">
                <button class="tool-button" id="pan-tool"><i class="fas fa-hand-paper"></i></button>
                <button class="tool-button" id="rotate-tool"><i class="fas fa-sync-alt"></i></button>
                <button class="tool-button" id="eyedropper-tool"><i class="fas fa-eye-dropper"></i></button>
                <button class="tool-button" id="select-tool"><i class="fas fa-mouse-pointer"></i></button>
                <!-- Активная кнопка "Кисть" -->
                <button class="tool-button active" id="pen-tool"><i class="fas fa-paint-brush"></i></button>
                <button class="tool-button" id="bucket-tool"><i class="fas fa-fill-drip"></i></button>
                <button class="tool-button" id="text-tool"><i class="fas fa-font"></i></button>
                <button class="tool-button" id="stamp-tool"><i class="fas fa-arrows-alt-v"></i></button>
                <button class="tool-button" id="rect-tool"><i class="fas fa-square"></i></button>
                <button class="tool-button" id="circle-tool"><i class="fas fa-circle"></i></button>
                <button class="tool-button" id="lasso-tool"><i class="fas fa-vector-square"></i></button>
                <button class="tool-button" id="effect-tool"><i class="fas fa-star"></i></button>
            </div>
            <div class="toolbar-bottom">
                <button class="tool-button" id="pencil-tool"><i class="fas fa-pencil-alt"></i></button>
            </div>
        </div>

        <!-- ОСНОВНАЯ ОБЛАСТЬ (Канвас + Правая панель настроек) -->
        <div class="main-area">
            <!-- Холст для рисования -->
            <div class="canvas-container">
                <canvas id="drawingCanvas"></canvas>
            </div>

            <!-- ПРАВАЯ ПАНЕЛЬ НАСТРОЕК -->
            <div class="settings-panel">
                <!-- Список пользователей -->
                <div class="panel-section">
                    <h3><i class="fas fa-users"></i> СПИСОК ПОЛЬЗОВАТЕЛЕЙ</h3>
                    <div class="user-list">
                        <span>Вы</span>
                        <span>Anonymous</span>
                    </div>
                </div>

                <!-- Настройки инструмента -->
                <div class="panel-section">
                    <h3><i class="fas fa-sliders-h"></i> НАСТРОЙКИ ИНСТРУМЕНТА</h3>
                    <div class="tool-settings">
                        <div class="setting-item">
                            <label>Размер</label>
                            <input type="number" id="size-setting" value="8">
                        </div>
                        <div class="setting-item">
                            <label>Непрозрачность</label>
                            <input type="number" id="opacity-setting" value="100">
                        </div>
                        <div class="setting-item">
                            <label>Размытие</label>
                            <input type="number" id="blur-setting" value="0">
                        </div>
                        <div class="setting-item">
                            <label>Сглаживание</label>
                            <input type="number" id="smoothing-setting" value="0">
                        </div>
                        <div class="setting-item">
                            <label>Шрифт</label>
                            <select id="font-setting">
                                <option>Rubik</option>
                                <option>Arial</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>Правый клик</label>
                            <select id="rightclick-setting">
                                <option>Следующий шрифт</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Пресеты цветов -->
                <div class="panel-section">
                    <h3><i class="fas fa-cloud"></i> ПРЕДУСТАНОВКИ</h3>
                    <div class="presets-grid" id="presets-grid">
                        <!-- 18 пресетов будут сгенерированы через JavaScript -->
                    </div>
                    <p class="presets-hint">Удерживайте для установки. Нажмите, чтобы загрузить.</p>
                </div>

                <!-- Цветовое колесо -->
                <div class="panel-section">
                    <h3><i class="fas fa-palette"></i> ЦВЕТОВОЕ КОЛЕСО</h3>
                    <div class="color-picker-wrapper">
                        <div class="color-wheel" id="colorWheel"></div>
                        <div class="color-preview">
                            <div class="color-swatch" id="primary-color" style="background-color: black;"></div>
                            <div class="color-swatch" id="secondary-color" style="background-color: white;"></div>
                            <i class="fas fa-exchange-alt swap-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- Слои -->
                <div class="panel-section">
                    <h3><i class="fas fa-layer-group"></i> СЛОЙ</h3>
                    <div class="layers-controls">
                        <button><i class="fas fa-arrow-down"></i></button>
                        <button><i class="fas fa-folder-plus"></i></button>
                        <button><i class="fas fa-arrows-alt-h"></i></button>
                        <button><i class="fas fa-arrows-alt-v"></i></button>
                        <button><i class="fas fa-save"></i></button>
                    </div>
                    <div class="layers-list" id="layers-list">
                        <!-- Слои будут сгенерированы через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <script src="app.js"></script>
    <script src="tools.js"></script>
    <script src="ui.js"></script>
    <script src="layers.js"></script>
</body>
</html>
