<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#fallback - FlockMod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-[#1a1a2e]">
        <div class="bg-[#16213e] p-8 rounded-2xl shadow-2xl w-96 border border-[#2a2a4a]">
            <h1 class="text-3xl font-bold text-center text-white mb-2">#fallback</h1>
            <p class="text-center text-gray-400 mb-8 text-sm">flockmod.com</p>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter username" class="w-full bg-[#0f1633] text-white border border-[#2a2a4a] rounded-lg px-4 py-2 focus:outline-none focus:border-[#4a4a8a] transition" />
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Password (optional)</label>
                    <input type="password" id="passwordInput" placeholder="Leave blank to skip" class="w-full bg-[#0f1633] text-white border border-[#2a2a4a] rounded-lg px-4 py-2 focus:outline-none focus:border-[#4a4a8a] transition" />
                </div>
                <button type="submit" class="w-full bg-[#4a4a8a] hover:bg-[#5a5a9a] text-white font-semibold py-2 rounded-lg transition duration-200">Join Room</button>
            </form>
            <div class="mt-4 text-center text-xs text-gray-500">
                <span>Room: fallback</span>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden h-screen bg-[#1a1a2e] flex overflow-hidden">
        <!-- Canvas Area -->
        <div class="flex-1 relative bg-[#0f1633]">
            <canvas id="canvas" class="w-full h-full cursor-crosshair"></canvas>
            <!-- User labels container -->
            <div id="userLabels" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <!-- Sidebar -->
        <div id="sidebar" class="w-[320px] bg-[#16213e] border-l border-[#2a2a4a] overflow-y-auto flex-shrink-0">
            <div class="p-4 space-y-6">
                <!-- User List -->
                <div>
                    <div class="text-[#8a8aaa] text-xs font-semibold uppercase tracking-wider mb-2">List of users</div>
                    <div id="userList" class="space-y-1">
                        <div class="text-white text-sm flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-400 rounded-full"></span>
                            <span id="currentUserDisplay">You</span>
                        </div>
                    </div>
                </div>

                <!-- Tool Settings -->
                <div>
                    <div class="text-[#8a8aaa] text-xs font-semibold uppercase tracking-wider mb-3">Tool settings</div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between items-center text-gray-300">
                            <span>Size</span>
                            <div class="flex items-center gap-2">
                                <input type="range" id="brushSize" min="1" max="50" value="8" class="w-24 accent-[#4a4a8a]" />
                                <span id="sizeValue" class="text-white w-6 text-center">8</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-gray-300">
                            <span>Opacity</span>
                            <div class="flex items-center gap-2">
                                <input type="range" id="brushOpacity" min="1" max="100" value="100" class="w-24 accent-[#4a4a8a]" />
                                <span id="opacityValue" class="text-white w-6 text-center">100</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-gray-300">
                            <span>Font</span>
                            <select id="fontSelect" class="bg-[#0f1633] text-white border border-[#2a2a4a] rounded px-2 py-1 text-sm">
                                <option value="Rubik">Rubik</option>
                                <option value="Arial">Arial</option>
                                <option value="Courier New">Courier New</option>
                                <option value="Georgia">Georgia</option>
                            </select>
                        </div>
                        <div class="flex justify-between items-center text-gray-300">
                            <span>Right click</span>
                            <select id="rightClickAction" class="bg-[#0f1633] text-white border border-[#2a2a4a] rounded px-2 py-1 text-sm">
                                <option value="undo">Undo stroke</option>
                                <option value="nextFont">Next font</option>
                                <option value="eraser">Eraser</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Presets -->
                <div>
                    <div class="text-[#8a8aaa] text-xs font-semibold uppercase tracking-wider mb-2">Presets</div>
                    <div class="grid grid-cols-6 gap-1">
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">1</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">2</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">3</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">4</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">5</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">6</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">7</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">8</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">9</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">10</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">11</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">12</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">13</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">14</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">15</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">16</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">17</button>
                        <button class="preset-btn bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white text-xs rounded p-1 transition">18</button>
                    </div>
                    <div class="text-[#6a6a8a] text-xs mt-1 text-center">Hold to set. Click to load.</div>
                </div>

                <!-- Color Wheel -->
                <div>
                    <div class="text-[#8a8aaa] text-xs font-semibold uppercase tracking-wider mb-2">Color Wheel</div>
                    <div class="relative">
                        <canvas id="colorWheel" width="200" height="100" class="w-full rounded-lg border border-[#2a2a4a]"></canvas>
                        <div class="flex gap-2 mt-2 items-center">
                            <div id="selectedColor" class="w-8 h-8 rounded border border-[#2a2a4a]" style="background: #ff6b6b"></div>
                            <input type="color" id="colorPicker" value="#ff6b6b" class="flex-1 h-8 bg-[#0f1633] border border-[#2a2a4a] rounded" />
                        </div>
                    </div>
                </div>

                <!-- Layer -->
                <div>
                    <div class="text-[#8a8aaa] text-xs font-semibold uppercase tracking-wider">Layer</div>
                    <div class="text-white text-sm mt-1">Cloud</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
